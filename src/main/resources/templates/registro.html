<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mi cuenta · ENSEÑA-ME</title><link rel="stylesheet" href="/css/estilos.css"></head><body><header><a class="marca" href="/">ENSEÑA-ME</a><nav aria-label="Principal"><a href="/catalogo">Explorar orientadores</a><a href="/mi-perfil">Mi perfil</a><a href="/suscripcion">Suscripción</a></nav></header><main class="cuenta"><section class="panel-cuenta"><p class="etiqueta">COMPARTE Y APRENDE</p><h1>Crea tu cuenta</h1><form th:action="@{/registro}" th:object="${registro}" method="post"><div class="errores" role="alert" th:if="${#fields.hasAnyErrors()}"><p>Revisa los datos. La contraseña debe tener entre 12 y 64 caracteres y hasta 72 bytes UTF-8.</p><p th:each="e : ${#fields.globalErrors()}" th:text="${e}"></p></div><label for="nombre">Nombre</label><input id="nombre" th:field="*{nombre}" maxlength="120" autocomplete="name" required><label for="correo">Correo electrónico</label><input id="correo" th:field="*{correo}" type="email" maxlength="254" autocomplete="username" required><label for="clave">Contraseña</label><input id="clave" name="clave" type="password" minlength="12" maxlength="64" autocomplete="new-password" required><p>Utiliza una frase de al menos 12 caracteres.</p><button>Crear cuenta</button></form><p><a href="/ingresar">Ya tengo una cuenta</a></p></section></main><footer>ENSEÑA-ME · Orientación entre estudiantes</footer></body></html>
